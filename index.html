px 26px}.q-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:16px}.q-meta .tag{color:var(--teal);font-weight:700}.question{font-size:21px;line-height:1.5;margin:0 0 25px;font-weight:650}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px 15px;background:#fbfcfc;border:1px solid #dfe7e8;border-radius:6px;color:var(--ink);transition:.16s}.option:hover{border-color:#91c7c3;background:#f3fbfa}.option .letter{flex:none;width:27px;height:27px;border-radius:50%;background:#e8eeee;color:#53666a;display:grid;place-items:center;font-weight:700;font-size:13px}.option.selected{border-color:var(--teal);background:#edf8f7}.option.selected .letter{background:var(--teal);color:#fff}.option.correct{border-color:#65b59c;background:#effaf5}.option.correct .letter{background:#2c9b75;color:#fff}.option.wrong{border-color:#e4a0a0;background:#fff4f4}.option.wrong .letter{background:var(--red);color:#fff}.option.disabled{cursor:default}.answer-note{margin-top:18px;border-left:3px solid var(--amber);padding:10px 13px;background:#fffaf0;color:#77551e;font-size:13px}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:19px}.btn{padding:10px 16px;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600}.btn:hover{background:#f1f5f5}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.primary:hover{background:var(--teal-dark)}.btn:disabled{opacity:.4;cursor:default}.hint{color:var(--muted);font-size:12px}.empty{padding:60px 20px;text-align:center;color:var(--muted)}
    @media(max-width:760px){.app{display:block}aside{height:auto;position:relative;padding:18px 15px;gap:13px}.sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;padding:0}.set-btn{white-space:normal;padding:7px 10px}.side-footer{display:none}.topbar{display:block;height:auto;min-height:62px;padding:12px 18px}.crumb{display:block;white-space:normal}.crumb strong{display:block;margin:0 0 2px}.top-actions{max-width:none;justify-content:flex-start;flex-wrap:wrap;margin-top:10px}.top-actions .pill:first-child{display:none}.content{padding:25px 16px 50px}.activity-head{align-items:flex-start}.activity-status{justify-content:flex-start;gap:6px}.set-score{padding-left:6px}.question-card{padding:23px 18px}.question{font-size:18px;line-height:1.6;line-break:strict}.controls{gap:8px;flex-wrap:wrap}.hint{display:none}}

<body>
<div id="choppedList" hidden></div>
<div class="app"><aside><div class="brand"><h1>ACP 练习台</h1><p>阿里云大模型 ACP 认证 · 离线题库</p></div><div><div class="side-label">选择套卷</div><div class="sets" id="sets"></div></div><div class="side-footer">进度自动保存至 MySQL</div></aside>
<main><header class="topbar"><div class="crumb"><strong id="setTitle">模拟试卷一</strong></div><div class="top-actions"><button class="pill" id="randomBtn">随机一题</button><button class="pill" id="exportBtn">导出备份</button><button class="pill" id="importBtn">导入进度</button><input id="importFile" type="file" accept="application/json,.json" hidden /><button class="pill" id="resetBtn">重置题库</button></div></header>
<section class="content"><div class="activity-panel" id="activityPanelSingle"><div class="activity-head"><strong>单选题完成记录</strong><div class="activity-status"><span id="activitySummarySingle">0 / 896 题已完成</span><span class="set-score">本套正确率 <b data-set-score>0%</b></span></div></div><div class="activity-grid" id="activityGridSingle" aria-label="单选题完成记录"></div><div class="activity-foot"><div class="activity-filters"><label><input type="checkbox" data-filter="wrong" />只做错题</label><label><input type="checkbox" data-filter="favorite" />只做收藏题</label><label><input type="checkbox" data-filter="excludeChopped" checked />排除已斩题</label></div><div class="activity-legend"><b>?</b><span>:当前题</span><i></i><span>:未完成</span><i class="done"></i><span>:已完成</span><i class="favorite"></i><span>:已收藏</span><i class="wrong"></i><span>:答错</span><i class="chopped"></i><span>:已斩题</span></div></div></div><div class="activity-panel" id="activityPanelMulti"><div class="activity-head"><strong>多选题完成记录</strong><div class="activity-status"><span id="activitySummaryMulti">0 / 370 题已完成</span><span class="set-score">本套正确率 <b data-set-score>0%</b></span></div></div><div class="activity-grid" id="activityGridMulti" aria-label="多选题完成记录"></div><div class="activity-foot"><div class="activity-filters"><label><input type="checkbox" data-filter="wrong" />只做错题</label><label><input type="checkbox" data-filter="favorite" />只做收藏题</label><label><input type="checkbox" data-filter="excludeChopped" checked />排除已斩题</label></div><div class="activity-legend"><b>?</b><span>:当前题</span><i></i><span>:未完成</span><i class="done"></i><span>:已完成</span><i class="favorite"></i><span>:已收藏</span><i class="wrong"></i><span>:答错</span><i class="chopped"></i><span>:已斩题</span></div></div></div><div class="question-card" id="card"></div></section></main></div>
<script type="module" src="app.js"></script><script type="text/plain">
const sets=window.QUIZ_SETS;let setIndex=0,qIndex=0,selected=[],submitted=false,wrongOnly=false,choppedOnly=false,globalWrong=false,globalChopped=false,globalFavorite=false,pendingQuestion=null;
sets.forEach(s=>s.questions.forEach(q=>{if(q.section==='multi')q.section='二、多选题';if(q.section==='single')q.section='一、单选题'}));
const $=id=>document.getElementById(id);
let progress={},saveQueue=Promise.resolve();async function loadProgress(){let response=await fetch('/api/progress');if(!response.ok)throw new Error('无法读取 MySQL 练习进度');progress=await response.json();setIndex=latestProgressSet();qIndex=resumeQuestionIndex(setIndex);renderSets();render();renderChopped()}loadProgress().catch(error=>console.error(error));
function currentSet(){return sets[setIndex]}; function choppedQuestions(){let excluded=progress[setIndex]?.excluded||[];return currentSet().questions.map((q,i)=>({q,i})).filter(x=>excluded.includes(x.i))}; function activeQuestions(){let excluded=progress[setIndex]?.excluded||[];return currentSet().questions.map((q,i)=>({q,i})).filter(x=>!excluded.includes(x.i))}; function latestProgressSet(){let latest=0;sets.forEach((s,i)=>{if((progress[i]?.done||[]).length||(progress[i]?.answers&&Object.keys(progress[i].answers).length))latest=i});return latest}; function resumeQuestionIndex(si){let p=progress[si]||{},excluded=new Set(p.excluded||[]),active=sets[si].questions.map((q,i)=>({q,i})).filter(x=>!excluded.has(x.i)),completed=new Set(p.done||[]);if(!active.length)return 0;let lastCompleted=active.reduce((last,x,index)=>completed.has(x.i)?index:last,-1);let firstUnfinished=active.findIndex((x,index)=>index>lastCompleted&&!completed.has(x.i));if(firstUnfinished>=0)return firstUnfinished;let beforeLast=active.findIndex(x=>!completed.has(x.i));return beforeLast>=0?beforeLast:active.length-1}; function questionEntries(){if(globalWrong){let out=[];sets.forEach((s,si)=>(progress[si]?.wrong||[]).forEach(i=>{if(!((progress[si]?.excluded||[]).includes(i))&&s.questions[i])out.push({q:s.questions[i],si,i})}));return out}if(globalChopped){let out=[];sets.forEach((s,si)=>(progress[si]?.excluded||[]).forEach(i=>{if(s.questions[i])out.push({q:s.questions[i],si,i})}));return out}if(choppedOnly)return choppedQuestions().map(x=>({...x,si:setIndex}));let active=activeQuestions();return (wrongOnly?active.filter(x=>(progress[setIndex]?.wrong||[]).includes(x.i)):active).map(x=>({...x,si:setIndex}))};function questions(){let entries=questionEntries();if((globalWrong||globalChopped)&&entries[qIndex])setIndex=entries[qIndex].si;return entries.map(x=>x.q)}
function save(){let snapshot=JSON.parse(JSON.stringify(progress));saveQueue=saveQueue.then(async()=>{let response=await fetch('/api/progress',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({progress:snapshot})});if(!response.ok)throw new Error('无法保存 MySQL 练习进度')}).catch(error=>console.error(error));return saveQueue}
function exportProgress(){const blob=new Blob(['window.ACA_PROGRESS = '+JSON.stringify({savedAt:new Date().toISOString(),data:progress},null,2)+';\n'],{type:'application/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aca-acp-progress.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
$('exportBtn').onclick=exportProgress;
function stats(){let p=progress[setIndex]||{},excluded=p.excluded||[],done=(p.done||[]).filter(i=>!excluded.includes(i));let correct=p.results?done.filter(i=>p.results[i]===true).length:Math.min(p.correct||0,done.length);return {done,correct}}
function renderSets(){ $('sets').innerHTML=sets.map((s,i)=>{let remaining=s.questions.length-(progress[i]?.excluded||[]).length;return `<button class="set-btn ${i===setIndex?'active':''}" data-i="${i}">${s.title.replace('大模型LLM ACA-ACP认证考试','').replace('（含答案）','')}<small>${remaining}</small></button>`}).join('');let chopped=choppedQuestions();$('choppedList').innerHTML=chopped.length?chopped.map(x=>`<div class="chopped-item"><span>第 ${x.q.number} 题</span><button data-restore="${x.i}">恢复</button></div>`).join(''):'<div class="chopped-empty">当前套卷暂无斩题</div>';document.querySelectorAll('.set-btn').forEach(b=>b.onclick=()=>{setIndex=+b.dataset.i;qIndex=resumeQuestionIndex(setIndex);wrongOnly=false;choppedOnly=false;selected=[];submitted=false;renderSets();render()});document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreChopped(+b.dataset.restore)) }
function render(){let qs=questions();$('wrongCount').textContent=(progress[setIndex]?.wrong||[]).filter(i=>!(progress[setIndex]?.excluded||[]).includes(i)).length;if(!qs.length){$('card').innerHTML='<div class="empty">这套题目前没有可练习的题目。</div>';return}if(qIndex>=qs.length)qIndex=qs.length-1;let q=qs[qIndex]; $('setTitle').textContent=currentSet().title.replace('大模型LLM ACA-ACP认证考试','').replace('（含答案）','');$('sectionTitle').textContent=q.section.replace(/（.*?）/g,'');let stat=stats();let done=stat.done;let correct=stat.correct;document.querySelectorAll('[data-set-score]').forEach(score=>score.textContent=`${done.length?Math.min(100,Math.round(correct/done.length*100)):0}%`);
 let multi=q.section.includes('多选');let key=currentSet().questions.indexOf(q);let savedAnswer=progress[setIndex]?.answers?.[String(key)];if(!submitted&&savedAnswer)selected=savedAnswer.split('');$('card').innerHTML=`<div class="q-meta"><span class="tag">${multi?'多选题':'单选题'}</span><span>题号 ${q.number}</span></div><h3 class="question">${q.text}</h3><div class="options">${q.options.map(o=>`<button class="option ${selected.includes(o.key)?'selected':''} ${submitted&&o.correct?'correct':''} ${submitted&&selected.includes(o.key)&&!o.correct?'wrong':''}" data-k="${o.key}"><span class="letter">${o.key}</span><span>${o.text}</span></button>`).join('')}</div>${submitted?`<div class="answer-note">正确答案：<b>${q.answer.split('').join('、')}</b>${selected.length?' · 你的选择：'+selected.join('、'):''}</div>`:''}<div class="controls"><div><button class="btn" id="prev" ${qIndex===0?'disabled':''}>上一题</button> <button class="btn" id="chop">斩题</button></div><span class="hint">${multi?'可选择多个选项':'请选择一个选项'}</span>${submitted?'<button class="btn primary" id="next">下一题</button>':'<button class="btn primary" id="submit">提交答案</button>'}</div>`;
 document.querySelectorAll('.option').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();if(submitted)return;let k=b.dataset.k;if(multi){selected=selected.includes(k)?selected.filter(x=>x!==k):[...selected,k];progress[setIndex]??={};progress[setIndex].answers??={};progress[setIndex].answers[key]=selected.join('');save();b.classList.toggle('selected',selected.includes(k));return}selected=[k];progress[setIndex]??={};progress[setIndex].answers??={};progress[setIndex].answers[key]=k;submit(true)});$('prev').onclick=()=>{if(qIndex>0){qIndex--;selected=[];submitted=false;render()}};$('chop').onclick=chop;if($('submit'))$('submit').onclick=submit;if($('next'))$('next').onclick=()=>{qIndex++;selected=[];submitted=false;render()}}
function chop(){let qs=questions(),q=qs[qIndex],key=currentSet().questions.indexOf(q);progress[setIndex]??={done:[],correct:0,wrong:[],excluded:[]};progress[setIndex].excluded??=[];if(!progress[setIndex].excluded.includes(key))progress[setIndex].excluded.push(key);selected=[];submitted=false;save();render()}
function resetChopped(){let p=progress[setIndex]||{},wrong=p.wrong||[],excluded=p.excluded||[];progress[setIndex]={wrong,excluded,done:[],correct:0,results:{}};wrongOnly=false;globalWrong=false;globalChopped=false;choppedOnly=false;qIndex=0;selected=[];submitted=false;$('wrongBtn').classList.remove('on');$('choppedBtn').classList.remove('on');save();renderSets();render()}
 function submit(){let qs=questions(),q=qs[qIndex],isCorrect=selected.slice().sort().join('')===q.answer.split('').sort().join('');let key=sets[setIndex].questions.indexOf(q);progress[setIndex]??={};progress[setIndex].done??=[];progress[setIndex].wrong??=[];progress[setIndex].results??={};if(!progress[setIndex].done.includes(key))progress[setIndex].done.push(key);progress[setIndex].results[key]=isCorrect;progress[setIndex].correct=Object.values(progress[setIndex].results).filter(Boolean).length;if(isCorrect){progress[setIndex].wrong=progress[setIndex].wrong.filter(i=>i!==key)}else if(!progress[setIndex].wrong.includes(key))progress[setIndex].wrong.push(key);save();if(isCorrect&&qIndex<qs.length-1){qIndex++;selected=[];submitted=false}else{submitted=true}render()}
function jumpRandom(){let qs=questions();if(qs.length){qIndex=Math.floor(Math.random()*qs.length);selected=[];submitted=false;render()}}
 $('randomBtn').onclick=jumpRandom;$('wrongBtn').onclick=()=>{wrongOnly=!wrongOnly;qIndex=0;selected=[];submitted=false;$('wrongBtn').classList.toggle('on',wrongOnly);render()};$('resetBtn').onclick=resetChopped;renderSets();render();
window.addEventListener('keydown',e=>{if(e.key==='Enter'&&!submitted)$('submit')?.click();if(e.key==='ArrowRight'&&submitted)$('next')?.click();if(e.key==='ArrowLeft')$('prev')?.click()});
function renderChopped(){let list=document.getElementById('choppedList'),items=[];sets.forEach((s,si)=>(progress[si]?.excluded||[]).forEach(i=>{if(s.questions[i])items.push({si,i,q:s.questions[i]})}));document.getElementById('choppedCount').textContent=items.length;let allWrong=0;sets.forEach((s,si)=>{let ex=progress[si]?.excluded||[];allWrong+=(progress[si]?.wrong||[]).filter(i=>!ex.includes(i)).length});document.getElementById('wrongCount').textContent=allWrong;list.innerHTML=items.length?items.map(x=>`<div class="chopped-item"><span>${x.si<10?'模拟':'真题'} · 第 ${x.q.number} 题</span><button data-restore-si="${x.si}" data-restore-key="${x.i}">恢复</button></div>`).join(''):'<div class="chopped-empty">暂无斩题</div>';list.querySelectorAll('[data-restore-key]').forEach(b=>b.onclick=()=>restoreChopped(+b.dataset.restoreSi,+b.dataset.restoreKey));let chopBtn=document.getElementById('chop');if(chopBtn){chopBtn.textContent=choppedOnly?'恢复本题':'斩题';chopBtn.onclick=()=>{if(choppedOnly){let q=questions()[qIndex];restoreChopped(setIndex,currentSet().questions.indexOf(q))}else chop()}}}
function restoreChopped(si,key){let stayGlobal=globalChopped;setIndex=si;progress[si]??={};progress[si].excluded=(progress[si].excluded||[]).filter(i=>i!==key);choppedOnly=stayGlobal;globalChopped=stayGlobal;wrongOnly=false;qIndex=0;selected=[];submitted=false;save();renderSets();render();renderChopped()}
document.getElementById('choppedBtn').onclick=()=>{globalChopped=!globalChopped;choppedOnly=globalChopped;globalWrong=false;wrongOnly=false;qIndex=0;selected=[];submitted=false;document.getElementById('choppedBtn').classList.toggle('on',globalChopped);document.getElementById('wrongBtn').classList.remove('on');render()};renderChopped();setInterval(renderChopped,500);
document.getElementById('wrongBtn').onclick=()=>{globalWrong=!globalWrong;wrongOnly=globalWrong;choppedOnly=false;qIndex=0;selected=[];submitted=false;document.getElementById('wrongBtn').classList.toggle('on',globalWrong);document.getElementById('choppedBtn').classList.remove('on');render()};
document.querySelectorAll('.set-btn').forEach(b=>b.addEventListener('click',()=>{globalWrong=false;globalChopped=false;document.getElementById('wrongBtn').classList.remove('on');document.getElementById('choppedBtn').classList.remove('on')},{capture:true}));
$('sets').addEventListener('click',e=>{let b=e.target.closest('.set-btn');if(!b)return;globalWrong=false;globalChopped=false;wrongOnly=false;choppedOnly=false;$('wrongBtn').classList.remove('on');$('choppedBtn').classList.remove('on')});
function ensureChoppedNext(){let controls=document.querySelector('.controls');if(controls&&!document.getElementById('skipQuestion')&&!document.getElementById('next')){let b=document.createElement('button');b.id='skipQuestion';b.className='btn primary';b.textContent='下一题';b.onclick=()=>{qIndex++;selected=[];submitted=false;render()};controls.appendChild(b)}}setInterval(ensureChoppedNext,300);
</script><script type="text/plain">
const baseQuestions=questions;
questions=function(){if(!globalFavorite)return baseQuestions();let entries=[];sets.forEach((s,si)=>(progress[si]?.favorite||[]).forEach(i=>{if(s.questions[i])entries.push({q:s.questions[i],si,i})}));if(entries[qIndex])setIndex=entries[qIndex].si;return entries.map(x=>x.q)};
const baseRender=render;
function renderActivity(){
  const current=questions()[qIndex];
  const currentIsMulti=current&&(current.section==='二、多选题'||current.section==='multi'||current.section.includes('多选'));
  const currentKey=current?currentSet().questions.indexOf(current):-1;
  const currentProgress=progress[setIndex]||{};
  const currentIsPending=currentKey>=0&&!(currentProgress.done||[]).includes(currentKey)&&!(currentProgress.excluded||[]).includes(currentKey);
  if(currentIsPending)pendingQuestion={si:setIndex,i:currentKey};
  $('activityPanelSingle').hidden=Boolean(current)&&currentIsMulti;
  $('activityPanelMulti').hidden=Boolean(current)&&!currentIsMulti;
  const sections=[
    {multi:false,grid:'activityGridSingle',summary:'activitySummarySingle'},
    {multi:true,grid:'activityGridMulti',summary:'activitySummaryMulti'}
  ];
  sections.forEach(section=>{
    const grid=$(section.grid),summary=$(section.summary);
    if(!grid||!summary)return;
    const entries=[];
    sets.forEach((s,si)=>s.questions.forEach((q,i)=>{
      const isMulti=q.section==='二、多选题'||q.section==='multi'||q.section.includes('多选');
      if(isMulti===section.multi)entries.push({q,si,i});
    }));
    const doneCount=entries.filter(x=>(progress[x.si]?.done||[]).includes(x.i)).length;
    summary.textContent=`${doneCount} / ${entries.length} 题已完成`;
    grid.style.gridTemplateColumns=`repeat(${Math.ceil(entries.length/7)}, 10px)`;
    grid.innerHTML=entries.map((x,i)=>{
      const p=progress[x.si]||{};
      const isChopped=(p.excluded||[]).includes(x.i);
      const state=isChopped?'done chopped':(p.wrong||[]).includes(x.i)?'wrong':(p.favorite||[]).includes(x.i)?'favorite':(p.done||[]).includes(x.i)?'done':'';
      const currentClass=pendingQuestion&&x.si===pendingQuestion.si&&x.i===pendingQuestion.i?' current':'';
      const viewingClass=x.si===setIndex&&x.i===currentKey&&((p.done||[]).includes(x.i)||isChopped)?' viewing':'';
      const title=isChopped?`已斩 · 第 ${x.q.number} 题`:`第 ${x.q.number} 题`;
      return `<button class="activity-cell ${state}${currentClass}${viewingClass}" data-activity="${i}" title="${title}">${currentClass?'?':''}</button>`;
    }).join('');
    grid.querySelectorAll('[data-activity]').forEach(cell=>cell.onclick=()=>{
      const x=entries[Number(cell.dataset.activity)];
      if(!x)return;
      setIndex=x.si;
      globalFavorite=false;globalWrong=false;globalChopped=false;wrongOnly=false;choppedOnly=false;
      const active=activeQuestions();
      const activeIndex=active.findIndex(item=>item.q===x.q);
      if(activeIndex>=0){qIndex=activeIndex}else{
        choppedOnly=true;
        const chopped=choppedQuestions();
        qIndex=Math.max(0,chopped.findIndex(item=>item.q===x.q));
      }
      selected=[];submitted=false;renderSets();render();
    });
  });
}
render=function(){baseRender();renderActivity();let q=questions()[qIndex];if(!q)return;let key=currentSet().questions.indexOf(q);let p=progress[setIndex]||{};let fav=p.favorite||[];let b=document.createElement('button');b.id='favoriteCurrent';b.className='btn';b.textContent=fav.includes(key)?'取消收藏':'收藏本题';b.onclick=()=>{progress[setIndex]??={};progress[setIndex].favorite??=[];let list=progress[setIndex].favorite;progress[setIndex].favorite=list.includes(key)?list.filter(i=>i!==key):[...list,key];save();render()};$('card').querySelector('.controls')?.prepend(b);$('favoriteCount').textContent=sets.reduce((n,s,i)=>n+(progress[i]?.favorite||[]).length,0)};
document.getElementById('favoriteBtn').onclick=()=>{globalFavorite=!globalFavorite;globalWrong=false;globalChopped=false;wrongOnly=false;choppedOnly=false;qIndex=0;selected=[];submitted=false;document.getElementById('favoriteBtn').classList.toggle('on',globalFavorite);document.getElementById('wrongBtn').classList.remove('on');document.getElementById('choppedBtn').classList.remove('on');render()};
render();
</script></body></html>
